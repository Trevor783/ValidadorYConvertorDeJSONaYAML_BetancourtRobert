<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_PARSE // Y2K DATA SUITE PRO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --bg-color: #0d0221;
      --card-bg: #190a38;
      --cyan-neon: #00f0ff;
      --magenta-neon: #ff007f;
      --yellow-neon: #ffe600;
      --border-glow: #261447;
      --text-main: #e0f6ff;
      --font-code: 'Courier New', 'VT323', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-code);
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 15px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-image: linear-gradient(180deg, rgba(255, 0, 127, 0.05) 50%, rgba(0, 240, 255, 0.05) 50%);
      background-size: 100% 4px;
    }

    header {
      margin-bottom: 10px;
      text-align: center;
      border-bottom: 2px dashed var(--cyan-neon);
      padding-bottom: 8px;
      text-shadow: 0 0 8px var(--cyan-neon);
    }

    header h1 { font-size: 1.8rem; color: var(--cyan-neon); letter-spacing: 2px; }
    header p { color: var(--magenta-neon); font-size: 0.85rem; font-weight: bold; }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background-color: var(--card-bg);
      padding: 10px;
      border: 2px solid var(--magenta-neon);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
      margin-bottom: 10px;
      align-items: center;
    }

    button, select {
      background-color: #000;
      color: var(--cyan-neon);
      border: 1px solid var(--cyan-neon);
      padding: 6px 10px;
      font-weight: bold;
      font-family: var(--font-code);
      text-transform: uppercase;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    button:hover {
      background-color: var(--cyan-neon);
      color: #000;
      box-shadow: 0 0 8px var(--cyan-neon);
    }

    button.alt { color: var(--magenta-neon); border-color: var(--magenta-neon); }
    button.alt:hover { background-color: var(--magenta-neon); color: #000; box-shadow: 0 0 8px var(--magenta-neon); }

    select { background-color: #000; }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
    }

    .editor-container {
      display: flex;
      flex-direction: column;
      background-color: var(--card-bg);
      border: 2px solid var(--border-glow);
      position: relative;
      min-height: 280px;
    }

    .editor-container.dragover {
      border-color: var(--yellow-neon);
      background-color: rgba(255, 230, 0, 0.1);
    }

    .editor-header {
      padding: 6px 10px;
      background-color: #000;
      border-bottom: 1px solid var(--border-glow);
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--yellow-neon);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea, .tree-view {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px;
      font-family: var(--font-code);
      font-size: 0.9rem;
      resize: none;
      outline: none;
      line-height: 1.4;
      overflow-y: auto;
    }

    /* Estilos del Árbol de Inspección */
    .tree-view { display: none; }
    .tree-view ul { list-style: none; padding-left: 15px; }
    .tree-node { cursor: pointer; color: var(--cyan-neon); }
    .tree-key { color: var(--magenta-neon); }
    .tree-value { color: var(--yellow-neon); }

    .status-bar {
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
      font-weight: bold;
    }

    .status-bar.error {
      display: block;
      background-color: rgba(255, 0, 0, 0.2);
      border: 1px solid #ff3333;
      color: #ff6666;
    }

    .status-bar.success {
      display: block;
      background-color: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan-neon);
      color: var(--cyan-neon);
    }

    /* Panel de Estadísticas Avanzadas */
    .stats-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      background-color: #000;
      border: 1px solid var(--border-glow);
      padding: 8px;
      margin-top: 10px;
      font-size: 0.75rem;
    }

    .stat-box {
      border: 1px solid var(--border-glow);
      padding: 4px 8px;
      text-align: center;
    }
    .stat-title { color: var(--magenta-neon); text-transform: uppercase; display: block; }
    .stat-value { color: var(--cyan-neon); font-size: 1rem; font-weight: bold; }

    .bottom-bar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .test-panel {
      flex: 1;
      background-color: var(--card-bg);
      padding: 8px;
      border: 1px dashed var(--cyan-neon);
    }

    .test-panel h3 { font-size: 0.75rem; color: var(--magenta-neon); margin-bottom: 5px; }
    .test-buttons { display: flex; gap: 5px; flex-wrap: wrap; }

    @media (max-width: 768px) {
      .workspace { grid-template-columns: 1fr; }
      body { height: auto; }
    }
  </style>
</head>
<body>

  <header>
    <h1>CYBER_PARSE // Y2K PRO</h1>
    <p>>_ ADVANCED_DATA_INSPECTOR.EXE</p>
  </header>

  <div class="toolbar">
    <button onclick="Toolbox.formatJSON()">⚡ [Format JSON]</button>
    <button onclick="Toolbox.minifyJSON()" class="alt">📉 [Minify]</button>
    <button onclick="Toolbox.jsonToYaml()">➡️ [JSON > YAML]</button>
    <button onclick="Toolbox.yamlToJson()">⬅️ [YAML > JSON]</button>
    <button onclick="Toolbox.toggleView()" class="alt" id="viewBtn">🌳 [Tree View]</button>
    
    <label for="indent" style="font-size: 0.75rem; margin-left: auto; color: var(--yellow-neon);">TAB:</label>
    <select id="indent">
      <option value="2">2</option>
      <option value="4" selected>4</option>
    </select>
    
    <button onclick="Toolbox.clearAll()" class="alt">✖ [CLEAR]</button>
  </div>

  <div class="workspace">
    <!-- Editor Entrada -->
    <div class="editor-container" id="dropInput">
      <div class="editor-header">
        <span>// INPUT_STREAM (Drag & Drop File)</span>
        <button onclick="Toolbox.copyToClipboard('input')" class="alt">COPY</button>
      </div>
      <textarea id="input" placeholder="> Drag .json/.yaml here or paste text..." spellcheck="false"></textarea>
    </div>

    <!-- Editor Salida -->
    <div class="editor-container">
      <div class="editor-header">
        <span>// OUTPUT_BUFFER</span>
        <div>
          <button onclick="Toolbox.downloadOutput()" class="alt">DOWNLOAD</button>
          <button onclick="Toolbox.copyToClipboard('output')" class="alt">COPY</button>
        </div>
      </div>
      <textarea id="output" readonly placeholder="> Awaiting command execution..." spellcheck="false"></textarea>
      <div id="treeView" class="tree-view"></div>
    </div>
  </div>

  <!-- Métricas Avanzadas -->
  <div class="stats-panel">
    <div class="stat-box">
      <span class="stat-title">Input Size</span>
      <span class="stat-value" id="statInSize">0 B</span>
    </div>
    <div class="stat-box">
      <span class="stat-title">Output Size</span>
      <span class="stat-value" id="statOutSize">0 B</span>
    </div>
    <div class="stat-box">
      <span class="stat-title">Reduction</span>
      <span class="stat-value" id="statRatio">0%</span>
    </div>
    <div class="stat-box">
      <span class="stat-title">Total Keys</span>
      <span class="stat-value" id="statKeys">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-title">Max Depth</span>
      <span class="stat-value" id="statDepth">0</span>
    </div>
  </div>

  <div id="status" class="status-bar"></div>

  <div class="bottom-bar">
    <div class="test-panel">
      <h3>// INJECT_PAYLOADS:</h3>
      <div class="test-buttons">
        <button onclick="TestData.loadValidJSON()">[1. JSON Valid]</button>
        <button onclick="TestData.loadInvalidJSON()" class="alt">[2. JSON Broken]</button>
        <button onclick="TestData.loadValidYAML()">[3. YAML Valid]</button>
        <button onclick="TestData.loadDeepJSON()">[4. Deep Nesting]</button>
      </div>
    </div>
  </div>

  <script>
    const Toolbox = (() => {
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      const treeViewEl = document.getElementById('treeView');
      const statusEl = document.getElementById('status');
      const indentEl = document.getElementById('indent');
      let isTreeView = false;

      const getIndent = () => parseInt(indentEl.value, 10);

      const showStatus = (msg, isErr = false) => {
        statusEl.className = `status-bar ${isErr ? 'error' : 'success'}`;
        statusEl.textContent = `SYSTEM_MSG: ${msg}`;
      };

      const clearStatus = () => { statusEl.className = 'status-bar'; statusEl.textContent = ''; };

      const parseJSON = (text) => {
        if (!text.trim()) throw new Error('Input buffer is empty.');
        return JSON.parse(text);
      };

      // --- CALCULADORA DE MÉTRICAS Y ESTADÍSTICAS ---
      const calculateMetrics = (dataObj, rawInput, rawOutput) => {
        const inBytes = new Blob([rawInput]).size;
        const outBytes = new Blob([rawOutput]).size;
        
        document.getElementById('statInSize').textContent = `${inBytes} B`;
        document.getElementById('statOutSize').textContent = `${outBytes} B`;
        
        const diff = inBytes > 0 ? (((inBytes - outBytes) / inBytes) * 100).toFixed(1) : 0;
        document.getElementById('statRatio').textContent = `${diff}%`;

        let keyCount = 0;
        let maxDepth = 0;

        const traverse = (node, depth) => {
          if (depth > maxDepth) maxDepth = depth;
          if (typeof node === 'object' && node !== null) {
            for (let key in node) {
              keyCount++;
              traverse(node[key], depth + 1);
            }
          }
        };

        if (dataObj) traverse(dataObj, 1);

        document.getElementById('statKeys').textContent = keyCount;
        document.getElementById('statDepth').textContent = maxDepth;
      };

      // --- GENERADOR DE ÁRBOL INTERACTIVO ---
      const buildTree = (obj) => {
        if (typeof obj !== 'object' || obj === null) {
          return `<span class="tree-value">${JSON.stringify(obj)}</span>`;
        }
        let html = '<ul>';
        for (let key in obj) {
          const isObj = typeof obj[key] === 'object' && obj[key] !== null;
          html += `<li>`;
          if (isObj) {
            html += `<span class="tree-node" onclick="this.parentElement.querySelector('ul')?.classList.toggle('hidden')">▼ </span>`;
          }
          html += `<span class="tree-key">"${key}"</span>: ${buildTree(obj[key])}</li>`;
        }
        html += '</ul>';
        return html;
      };

      const updateOutput = (text, dataObj = null) => {
        outputEl.value = text;
        if (dataObj) {
          treeViewEl.innerHTML = buildTree(dataObj);
          calculateMetrics(dataObj, inputEl.value, text);
        }
        // Guardar en LocalStorage
        localStorage.setItem('y2k_last_input', inputEl.value);
      };

      return {
        getInputEl: () => inputEl,

        formatJSON: () => {
          clearStatus();
          try {
            const parsed = parseJSON(inputEl.value);
            const res = JSON.stringify(parsed, null, getIndent());
            updateOutput(res, parsed);
            showStatus('JSON structured & validated.');
          } catch (e) { showStatus(e.message, true); }
        },

        minifyJSON: () => {
          clearStatus();
          try {
            const parsed = parseJSON(inputEl.value);
            const res = JSON.stringify(parsed);
            updateOutput(res, parsed);
            showStatus('JSON minified into payload stream.');
          } catch (e) { showStatus(e.message, true); }
        },

        jsonToYaml: () => {
          clearStatus();
          try {
            const parsed = parseJSON(inputEl.value);
            const res = jsyaml.dump(parsed, { indent: getIndent() });
            updateOutput(res, parsed);
            showStatus('Transpiled JSON to YAML.');
          } catch (e) { showStatus(e.message, true); }
        },

        yamlToJson: () => {
          clearStatus();
          try {
            if (!inputEl.value.trim()) throw new Error('Buffer empty.');
            const parsed = jsyaml.load(inputEl.value);
            const res = JSON.stringify(parsed, null, getIndent());
            updateOutput(res, parsed);
            showStatus('Transpiled YAML to JSON.');
          } catch (e) { showStatus(e.message, true); }
        },

        toggleView: () => {
          isTreeView = !isTreeView;
          outputEl.style.display = isTreeView ? 'none' : 'block';
          treeViewEl.style.display = isTreeView ? 'block' : 'none';
          document.getElementById('viewBtn').textContent = isTreeView ? '📝 [Raw Text]' : '🌳 [Tree View]';
        },

        downloadOutput: () => {
          if (!outputEl.value) return;
          const blob = new Blob([outputEl.value], { type: 'text/plain' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'cyber_parsed_data.txt';
          a.click();
        },

        clearAll: () => {
          inputEl.value = '';
          outputEl.value = '';
          treeViewEl.innerHTML = '';
          calculateMetrics(null, '', '');
          clearStatus();
        },

        copyToClipboard: async (id) => {
          const el = document.getElementById(id);
          if (!el.value) return;
          await navigator.clipboard.writeText(el.value);
          showStatus(`Copied ${id.toUpperCase()} to system memory.`);
        }
      };
    })();

    // --- DRAG AND DROP HANDLER ---
    const dropZone = document.getElementById('dropInput');
    ['dragenter', 'dragover'].forEach(name => {
      dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
    });
    ['dragleave', 'drop'].forEach(name => {
      dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
    });
    dropZone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => { Toolbox.getInputEl().value = event.target.result; };
        reader.readAsText(file);
      }
    });

    // --- PAYLOADS DE PRUEBA ---
    const TestData = (() => {
      return {
        loadValidJSON: () => {
          Toolbox.getInputEl().value = '{\n  "hackers": ["Zero Cool", "Acid Burn", "Cereal Killer"],\n  "system": "Gibson",\n  "status": "Breached"\n}';
        },
        loadInvalidJSON: () => {
          Toolbox.getInputEl().value = '{\n  "system": "Gibson"\n  "missing_comma": true\n}';
        },
        loadValidYAML: () => {
          Toolbox.getInputEl().value = 'target: Gibson Mainframe\naccess_level: Root\ncommands:\n  - bypass_firewall\n  - extract_data';
        },
        loadDeepJSON: () => {
          Toolbox.getInputEl().value = '{\n  "level1": {\n    "level2": {\n      "level3": {\n        "secret": "Cyberpunk 2000"\n      }\n    }\n  }\n}';
        }
      };
    })();

    // Cargar último estado de LocalStorage si existe
    window.onload = () => {
      const last = localStorage.getItem('y2k_last_input');
      if (last) Toolbox.getInputEl().value = last;
    };
  </script>
</body>
</html>
